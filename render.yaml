services:
  # Backend API Service
  - type: web
    name: marketplace-api
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: MEILISEARCH_URL
        value: http://localhost:7700
      - key: MEILISEARCH_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: ADMIN_EMAIL
        value: admin@marketplace.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OTP_PROVIDER
        value: mock

  # Frontend Static Site
  - type: static
    name: marketplace-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: PACKAGE_MANAGER
        value: npm
      - key: VITE_API_URL
        sync: false
